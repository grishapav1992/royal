name: royal-ai
services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    mem_limit: 192m
    cpus: 0.5
    environment:
      POSTGRES_DB: factory
      POSTGRES_USER: factory
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=30", "-c", "work_mem=2MB"]
    volumes:
      - factory_db:/var/lib/postgresql/data
    secrets:
      - db_password
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory -d factory"]
      interval: 10s
      timeout: 5s
      retries: 12
  api:
    build:
      context: .
      target: app
    image: royal-ai-api:current
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    environment:
      APP_ORIGIN: https://stealth-spark-gokmxooi.expresshost.cloud
      URL_PREFIX: /team
      FACTORY_DATABASE_URL_FILE: /run/secrets/database_url
      FACTORY_ARTIFACTS_DIR: /artifacts
      KNOWLEDGE_GRAPH_URL: http://knowledge-graph:8093
    secrets: [database_url]
    volumes:
      - factory_data:/data
      - factory_artifacts:/artifacts:ro
    networks:
      private: {}
      ingress:
        aliases: [royal-ai-api]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:2580/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
    security_opt: [no-new-privileges:true]
  worker:
    init: true
    build:
      context: .
      target: worker
    image: royal-ai-worker:current
    restart: unless-stopped
    mem_limit: 1024m
    cpus: 1.0
    pids_limit: 256
    environment:
      FACTORY_DATABASE_URL_FILE: /run/secrets/database_url
      FACTORY_DATA: /data
      FACTORY_ARTIFACTS_DIR: /artifacts
      BROWSER_CHECKS_DIR: /browser-checks
      KNOWLEDGE_GRAPH_URL: http://knowledge-graph:8093
    secrets: [database_url]
    volumes:
      - factory_runs:/data
      - factory_auth:/home/node/.codex
      - factory_workspaces:/workspaces
      - factory_artifacts:/artifacts
      - /opt/royal-ai-browser-queue:/browser-checks
      - /opt/royal-ai-project:/project:ro
    networks: [private,worker_egress]
    depends_on:
      api:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - apparmor=royal-ai-worker
      - seccomp=/opt/royal-ai/deployment/worker-seccomp.json
  knowledge-graph:
    init: true
    build:
      context: ./knowledge-graph
    image: royal-ai-knowledge-graph:current
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 64
    volumes:
      - factory_knowledge_graph:/data
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks: [private]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  factory_db:
  factory_data:
  factory_runs:
  factory_auth:
  factory_workspaces:
  factory_artifacts:
  factory_knowledge_graph:
networks:
  private:
    internal: true
  worker_egress: {}
  ingress:
    external: true
    name: royal_default
secrets:
  db_password:
    file: /opt/royal-ai-secrets/db-password
  database_url:
    file: /opt/royal-ai-secrets/database-url
