name: royal-nile-play
services:
  nile-play:
    build:
      context: ../..
      dockerfile: deployment/finance/Dockerfile.nile-play
    image: royal-nile-play:local
    container_name: royal-nile-play
    restart: unless-stopped
    init: true
    environment:
      DATABASE_LOCAL_SNAPSHOTS: "false"
      PGHOST: ${ROYAL_PGHOST:-finance-db}
      PGPORT: ${ROYAL_PGPORT:-5432}
      PGDATABASE: ${ROYAL_PGDATABASE:-royal_finance_sim}
      PGUSER: royal_nile_play_app
      PGPASSWORD_FILE: /run/secrets/royal_database_password
      PGSSLMODE: ${ROYAL_PGSSLMODE:-disable}
      NILE_PLAY_SCHEMA: royal_nile_play
      FINANCE_ADMIN_ACCOUNT_IDS: ${FINANCE_ADMIN_ACCOUNT_IDS:-}
      NILE_TEST_SCHEMA: royal_nile_deposits
      NILE_TEST_MODE: testnet-only
      NILE_TEST_NETWORK: nile
      NILE_PLAY_CONFIG_FILE: /config/play.json
      NILE_PLAY_SOCKET_FILE: /run/nile/play.sock
    secrets: [royal_database_password]
    volumes:
      - type: bind
        source: /opt/royal-nile-play-data
        target: /data
        bind: {create_host_path: false}
      - type: bind
        source: /opt/royal-nile-play-config
        target: /config
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /opt/royal-nile-test-data
        target: /ledger
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /opt/royal-nile-account-input
        target: /operations
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /opt/royal-nile-play-sockets
        target: /run/nile
        bind: {create_host_path: false}
    networks: [royal_database]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 2
    cpu_shares: 8192
    pids_limit: 32
    stop_grace_period: 15s
    healthcheck:
      test: [CMD, node, play.js, health]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

networks:
  royal_database:
    external: true
    name: ${ROYAL_PGNETWORK:-royal-finance-sim_finance_private}

secrets:
  royal_database_password:
    file: ${ROYAL_POSTGRES_SECRETS_DIR:-/opt/royal-postgres-secrets}/nile-play-password
