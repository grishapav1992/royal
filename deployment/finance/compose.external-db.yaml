# Future runtime on an application host. It requires an existing primary endpoint.
# This file does not provision, promote or initialize a database cluster.
name: royal-finance-external-sim

services:
  finance-api:
    image: royal-finance-sim:local
    restart: unless-stopped
    init: true
    deploy: {replicas: 2}
    environment: &external_finance_environment
      NODE_ENV: development
      FINANCE_MODE: simulation
      FINANCE_BIND_HOST: 0.0.0.0
      FINANCE_NETWORK_SCOPE: private-docker
      FINANCE_DB_HOST: ${FINANCE_DB_HOST:?Set the existing primary database endpoint}
      FINANCE_DB_PORT: ${FINANCE_DB_PORT:-5432}
      FINANCE_DB_NAME: ${FINANCE_DB_NAME:-royal_finance_sim}
      FINANCE_DB_USER: finance_app
      FINANCE_DB_PASSWORD_FILE: /run/secrets/finance_app_password
      FINANCE_DB_TLS: verify-full
      FINANCE_DB_CA_FILE: /run/secrets/finance_db_ca
      FINANCE_DB_POOL_MAX: ${FINANCE_DB_POOL_MAX:-5}
      FINANCE_SANDBOX_TOKEN_FILE: /run/secrets/finance_sandbox_token
    secrets: [finance_app_password, finance_sandbox_token, finance_db_ca]
    networks: [finance_private, database_egress]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.75
    pids_limit: 64
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:2570/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: &external_finance_logging
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  finance-gateway:
    image: haproxy:3.0-alpine@sha256:56b887da77428b7a6621e59e480cdbd330cc805c22d3cedb66ceea76ffdea2c6
    user: haproxy
    restart: unless-stopped
    depends_on:
      finance-api: {condition: service_healthy}
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks: [finance_private]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 32
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:2570/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *external_finance_logging

  finance-migrate:
    image: royal-finance-sim:local
    profiles: [migrate]
    command: [node, dist-finance-tools/finance-migrate.js]
    group_add: ["999"]
    environment:
      <<: *external_finance_environment
      FINANCE_DB_USER: ${FINANCE_MIGRATION_DB_USER:-finance_schema_owner}
      FINANCE_DB_PASSWORD_FILE: /run/secrets/finance_admin_password
      FINANCE_DB_POOL_MAX: "1"
    secrets: [finance_admin_password, finance_db_ca]
    networks: [database_egress]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 64
    logging: *external_finance_logging

networks:
  finance_private: {internal: true}
  database_egress: {}

secrets:
  finance_app_password:
    file: ${FINANCE_SECRETS_DIR:-/opt/royal-finance-secrets}/app-password
  finance_sandbox_token:
    file: ${FINANCE_SECRETS_DIR:-/opt/royal-finance-secrets}/sandbox-token
  finance_admin_password:
    file: ${FINANCE_SECRETS_DIR:-/opt/royal-finance-secrets}/admin-password
  finance_db_ca:
    file: ${FINANCE_SECRETS_DIR:-/opt/royal-finance-secrets}/db-ca.pem
