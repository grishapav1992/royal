name: royal-tron-reader

services:
  tron-reader:
    build:
      context: ../..
      dockerfile: deployment/finance/Dockerfile.tron-reader
    image: royal-tron-reader:local
    container_name: royal-tron-reader
    restart: unless-stopped
    init: true
    environment:
      DATABASE_LOCAL_SNAPSHOTS: "false"
      PGHOST: ${ROYAL_PGHOST:-finance-db}
      PGPORT: ${ROYAL_PGPORT:-5432}
      PGDATABASE: ${ROYAL_PGDATABASE:-royal_finance_sim}
      PGUSER: royal_tron_reader_app
      PGPASSWORD_FILE: /run/secrets/royal_database_password
      PGSSLMODE: ${ROYAL_PGSSLMODE:-disable}
      TRON_READER_SCHEMA: royal_tron_reader
      TRON_READER_MODE: watch-only
      TRON_READER_NETWORK: nile
      TRON_READER_CONFIG_FILE: /config/nile.json
      TRON_READER_POLL_MS: "15000"
    secrets: [royal_database_password]
    volumes:
      - type: bind
        source: ${TRON_READER_DATA_DIR:-/opt/royal-tron-reader-data}
        target: /data
        bind: {create_host_path: false}
      - type: bind
        source: ${TRON_READER_CONFIG_DIR:-/opt/royal-tron-reader-config}
        target: /config
        read_only: true
        bind: {create_host_path: false}
    networks: [tron_rpc, royal_database]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 192m
    cpus: 0.25
    pids_limit: 32
    stop_grace_period: 15s
    healthcheck:
      test: [CMD, node, reader.js, health]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

networks:
  tron_rpc:
  royal_database:
    external: true
    name: ${ROYAL_PGNETWORK:-royal-finance-sim_finance_private}

secrets:
  royal_database_password:
    file: ${ROYAL_POSTGRES_SECRETS_DIR:-/opt/royal-postgres-secrets}/tron-reader-password
