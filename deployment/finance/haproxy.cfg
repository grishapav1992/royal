global
    log stdout format raw local0
    maxconn 128

defaults
    mode http
    log global
    option httplog
    option http-server-close
    timeout connect 2s
    timeout client 20s
    timeout server 15s
    timeout http-request 5s
    retries 0

resolvers docker_dns
    nameserver docker 127.0.0.11:53
    accepted_payload_size 8192
    hold valid 2s
    hold obsolete 2s
    hold nx 2s
    hold timeout 2s
    timeout resolve 1s
    timeout retry 1s

frontend finance_service
    bind :2570
    default_backend finance_instances

backend finance_instances
    balance roundrobin
    option httpchk GET /healthz
    http-check expect status 200
    # Operators use this header to verify routing; the gateway has no public port.
    http-response set-header X-Finance-Backend %[srv_name]
    default-server inter 2s fall 2 rise 2 maxconn 64
    server-template api 2 finance-api:2570 check resolvers docker_dns init-addr none resolve-prefer ipv4
