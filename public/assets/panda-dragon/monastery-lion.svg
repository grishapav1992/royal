<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260">
  <defs>
    <linearGradient id="stone" x1=".15" y1="0" x2=".85" y2="1">
      <stop stop-color="#b0aa9b"/>
      <stop offset=".42" stop-color="#8d897b"/>
      <stop offset="1" stop-color="#5b584f"/>
    </linearGradient>
    <linearGradient id="stoneDark" x1=".1" y1="0" x2=".9" y2="1">
      <stop stop-color="#8d8979"/>
      <stop offset=".55" stop-color="#6c6960"/>
      <stop offset="1" stop-color="#484640"/>
    </linearGradient>
    <linearGradient id="maneLight" x1=".2" y1="0" x2=".9" y2="1">
      <stop stop-color="#bab4a4"/>
      <stop offset=".5" stop-color="#948f81"/>
      <stop offset="1" stop-color="#635f57"/>
    </linearGradient>
    <filter id="grain" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".2 .24" numOctaves="3" seed="41" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="faint"><feFuncA type="linear" slope=".22"/></feComponentTransfer>
      <feComposite in="faint" in2="SourceGraphic" operator="in" result="texture"/>
      <feBlend in="SourceGraphic" in2="texture" mode="multiply"/>
    </filter>
  </defs>
  <g filter="url(#grain)">

  <ellipse cx="112" cy="250" rx="86" ry="9" fill="#242a22" opacity=".45"/>

  <!-- plinth and pedestal -->
  <path d="M22 236h176v16H22Z" fill="#4d4b43"/>
  <path d="M22 236h176v6H22Z" fill="#68655c"/>
  <path d="M36 190h148v48H36Z" fill="url(#stone)"/>
  <path d="M36 190h148v9H36Z" fill="#b3ad9e"/>
  <path d="M36 232h148v6H36Z" fill="#53514a"/>
  <path d="M54 190v48M92 190v48M130 190v48M166 190v48" fill="none" stroke="#605d54" stroke-opacity=".4" stroke-width="1.4"/>
  <path d="M40 201h140" fill="none" stroke="#c0b9a8" stroke-opacity=".18" stroke-width="1.2"/>
  <path d="M36 190h148v48H36Z" fill="none" stroke="#494740" stroke-opacity=".4" stroke-width="1.6"/>

  <!-- tail curled along the left flank -->
  <path d="M76 188c-24 2-38-12-34-32 3-16 20-22 29-13 7 7 3 18-5 21-6 2-11-3-9-8" fill="none" stroke="url(#stoneDark)" stroke-width="12" stroke-linecap="round"/>
  <path d="M74 184c-18 2-28-9-25-23" fill="none" stroke="#b6b0a1" stroke-opacity=".3" stroke-width="3" stroke-linecap="round"/>

  <!-- seated body -->
  <path d="M62 192c-5-38 8-66 34-79 22-11 46-3 56 19 8 18 5 42-6 60Z" fill="url(#stoneDark)"/>
  <path d="M74 190c-3-30 7-52 26-62 16-8 34-2 41 13 7 14 4 33-7 49Z" fill="url(#stone)" opacity=".45"/>

  <!-- front leg with a paw on the ball -->
  <path d="M150 130c9-2 16 3 17 11l4 44c1 9-5 14-13 14-7 0-12-5-12-13l-2-41c-1-6 1-12 6-15Z" fill="url(#stone)"/>
  <path d="M157 138c4 1 6 4 6 9l3 38" fill="none" stroke="#bcb5a4" stroke-opacity=".3" stroke-width="2.4"/>
  <circle cx="163" cy="196" r="14" fill="url(#stoneDark)"/>
  <g fill="none" stroke="#5d5a51" stroke-opacity=".45" stroke-width="1.5">
    <path d="M158 187c-3 4-3 8 0 11M167 186c3 4 3 8 0 11M151 193c3 2 4 5 4 8"/>
  </g>

  <!-- mane and head as one mass -->
  <path d="M126 44c24-3 45 10 52 31 6 17 1 36-12 47-15 13-38 15-56 4-18-11-27-32-21-51 5-16 20-29 37-31Z" fill="url(#maneLight)"/>
  <!-- snout -->
  <path d="M168 88c10-2 19 3 21 11 2 9-4 16-13 17-9 1-16-4-17-12-1-8 3-14 9-16Z" fill="url(#stone)"/>
  <path d="M178 96c5 0 8 3 8 7s-3 7-8 7-8-3-8-7 3-7 8-7Z" fill="#3f3d36"/>
  <path d="M168 112c8 3 15 3 21 0-2 9-8 14-15 13-6-1-8-6-6-13Z" fill="#3b3932"/>
  <path d="M172 114c4 1 8 1 12 0" fill="none" stroke="#c9c2b0" stroke-opacity=".5" stroke-width="1.8"/>
  <!-- brow shadow and eye hollow -->
  <path d="M146 74c6-5 15-5 21 1" fill="none" stroke="#5c594f" stroke-opacity=".55" stroke-width="3.4" stroke-linecap="round"/>
  <ellipse cx="155" cy="83" rx="4.2" ry="3.4" fill="#4a4841"/>
  <!-- ear -->
  <path d="M112 48c2-9 9-14 17-12 6 2 9 8 7 14-8 3-17 3-24-2Z" fill="url(#stoneDark)"/>

  <!-- carved mane curls -->
  <g fill="none" stroke="#5f5c53" stroke-opacity=".5" stroke-width="2.6" stroke-linecap="round">
    <path d="M100 66c-10 5-14 17-10 27"/>
    <path d="M94 96c-7 9-5 20 2 27"/>
    <path d="M104 122c-5 8-2 17 5 22"/>
    <path d="M86 80c-6 8-6 18-1 25"/>
    <path d="M124 52c-9 8-11 20-5 29"/>
    <path d="M152 46c-8 8-10 19-5 27"/>
    <path d="M112 140c4 8 3 16-3 21"/>
  </g>
  <g fill="none" stroke="#c9c2b0" stroke-opacity=".38" stroke-width="1.6" stroke-linecap="round">
    <path d="M106 64c-7 6-9 15-6 22"/>
    <path d="M130 50c-6 7-7 16-3 23"/>
    <path d="M158 46c-6 7-6 15-2 21"/>
    <path d="M92 94c-4 7-3 14 1 19"/>
  </g>

  <!-- weathering -->
  <g fill="#6f7c63" opacity=".32">
    <path d="M42 222c11-6 23-7 31-3-9 6-21 8-31 3Z"/>
    <path d="M146 230c12-4 24-3 32 3-11 3-23 2-32-3Z"/>
  </g>
  <g fill="none" stroke="#4e4b43" stroke-opacity=".3" stroke-width="1.3">
    <path d="M44 202h26M120 206h16M58 216h20M146 214h22M88 230h26"/>
  </g>
  </g>
</svg>
