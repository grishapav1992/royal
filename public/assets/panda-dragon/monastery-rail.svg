<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120">
  <defs>
    <linearGradient id="granite" x1="0" x2=".8" y2="1">
      <stop stop-color="#aaa390"/>
      <stop offset=".42" stop-color="#847f70"/>
      <stop offset="1" stop-color="#555249"/>
    </linearGradient>
    <linearGradient id="beam" x1=".1" x2=".7" y2="1">
      <stop stop-color="#9d9784"/>
      <stop offset=".5" stop-color="#7c776a"/>
      <stop offset="1" stop-color="#514e45"/>
    </linearGradient>
    <linearGradient id="panel" x1=".2" x2=".9" y2="1">
      <stop stop-color="#8e8879"/>
      <stop offset=".6" stop-color="#6f6a5f"/>
      <stop offset="1" stop-color="#4d4a42"/>
    </linearGradient>
    <filter id="grain" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".16 .21" numOctaves="3" seed="41" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="faint"><feFuncA type="linear" slope=".18"/></feComponentTransfer>
      <feComposite in="faint" in2="SourceGraphic" operator="in" result="texture"/>
      <feBlend in="SourceGraphic" in2="texture" mode="multiply"/>
    </filter>
  </defs>
  <g filter="url(#grain)">

  <!-- ground shadow -->
  <path d="M0 108 320 92v20L0 128Z" fill="#23291f" opacity=".38"/>

  <!-- lower rail -->
  <path d="M0 88 320 74v16L0 106Z" fill="url(#beam)"/>
  <path d="M0 88 320 74" fill="none" stroke="#c0b8a3" stroke-opacity=".55" stroke-width="1.6"/>
  <path d="M0 106 320 90" fill="none" stroke="#3e3c34" stroke-opacity=".5" stroke-width="1.4"/>

  <!-- carved panels -->
  <g fill="url(#panel)">
    <path d="M18 54 96 50v30L18 84Z"/>
    <path d="M104 50 182 46v30l-78 4Z"/>
    <path d="M190 46 268 42v30l-78 4Z"/>
    <path d="M276 42 316 40v30l-40 2Z"/>
  </g>
  <g fill="none" stroke="#bdb5a0" stroke-opacity=".42" stroke-width="1.3">
    <path d="M28 58 86 54v22L28 80Z"/>
    <path d="M114 54 172 50v22l-58 4Z"/>
    <path d="M200 50 258 46v22l-58 4Z"/>
  </g>
  <!-- carved fret relief -->
  <g fill="none" stroke="#4f4c43" stroke-opacity=".5" stroke-width="1.4">
    <path d="M34 66h10v-6h10v12H44v-6h4"/>
    <path d="M62 62h10v12H62v-6h4"/>
    <path d="M120 62h10v12h-10v-6h4M148 58h10v12h-10v-6h4"/>
    <path d="M206 58h10v12h-10v-6h4M234 54h10v12h-10v-6h4"/>
    <path d="M286 54h8v10h-8v-4h3"/>
  </g>

  <!-- square posts with plain caps -->
  <g fill="url(#granite)">
    <path d="M4 40h16v58H4Z"/>
    <path d="M90 36h15v58H90Z"/>
    <path d="M176 32h14v58h-14Z"/>
    <path d="M262 28h13v58h-13Z"/>
  </g>
  <g fill="#c6bfa8" opacity=".8">
    <path d="M2 34h20v8H2Z"/>
    <path d="M88 30h19v8H88Z"/>
    <path d="M174 26h18v8h-18Z"/>
    <path d="M260 22h17v8h-17Z"/>
  </g>
  <g fill="#4a473f" opacity=".6">
    <path d="M18 42h4v56h-4Z"/><path d="M104 38h3v56h-3Z"/>
    <path d="M189 34h3v56h-3Z"/><path d="M274 30h3v56h-3Z"/>
  </g>

  <!-- hand rail -->
  <path d="M0 32 320 18v14L0 46Z" fill="url(#beam)"/>
  <path d="M0 32 320 18" fill="none" stroke="#c6bdab" stroke-opacity=".6" stroke-width="2"/>
  <path d="M0 46 320 32" fill="none" stroke="#3f3d35" stroke-opacity=".55" stroke-width="1.6"/>
  </g>
</svg>
