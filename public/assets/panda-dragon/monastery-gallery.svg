<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400">
  <defs>
    <linearGradient id="roof" x1=".06" y1="0" x2=".55" y2="1">
      <stop stop-color="#93a189"/>
      <stop offset=".3" stop-color="#6b7a6c"/>
      <stop offset=".68" stop-color="#4a584f"/>
      <stop offset="1" stop-color="#35413b"/>
    </linearGradient>
    <linearGradient id="eave" x1="0" x2="0" y2="1">
      <stop stop-color="#414d45"/>
      <stop offset=".55" stop-color="#2b342f"/>
      <stop offset="1" stop-color="#1d2421"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" x2="0" y2="1">
      <stop stop-color="#a4443a"/>
      <stop offset=".55" stop-color="#8a332c"/>
      <stop offset="1" stop-color="#5c2320"/>
    </linearGradient>
    <linearGradient id="column" x1="0" x2="1">
      <stop stop-color="#5f221f"/>
      <stop offset=".34" stop-color="#a8443a"/>
      <stop offset=".62" stop-color="#bb5548"/>
      <stop offset="1" stop-color="#6a2823"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" x2="0" y2="1">
      <stop stop-color="#2b332e"/>
      <stop offset="1" stop-color="#171d1a"/>
    </linearGradient>
    <linearGradient id="platform" x1=".5" y1="0" x2=".5" y2="1">
      <stop stop-color="#b3ae9f"/>
      <stop offset=".5" stop-color="#979286"/>
      <stop offset="1" stop-color="#6e6a60"/>
    </linearGradient>
    <linearGradient id="fadeRight" x1="0" x2="1">
      <stop offset=".34" stop-color="#fff"/>
      <stop offset=".72" stop-color="#8a8a8a"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <mask id="maskRight"><rect width="560" height="400" fill="url(#fadeRight)"/></mask>
    <path id="roofPlane" d="M-20 54 430 86q44 3 62 16l18 34q-20 6-46 2L-20 108Z"/>
    <clipPath id="roofClip"><use href="#roofPlane"/></clipPath>
    <pattern id="lattice" width="13" height="15" patternUnits="userSpaceOnUse">
      <path d="M1 15V1h11v13H4V5h5v6H5" fill="none" stroke="#6d7560" stroke-width="1.1" opacity=".5"/>
    </pattern>
    <pattern id="tileEnds" width="17" height="9" patternUnits="userSpaceOnUse">
      <path d="M1 9V3a7.5 7.5 0 0 1 15 0v6" fill="none" stroke="#98a48d" stroke-opacity=".45" stroke-width="1.2"/>
    </pattern>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".13 .19" numOctaves="3" seed="27"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <g mask="url(#maskRight)">
  <!-- stone platform and steps -->
  <path d="M0 330 470 316l90 10v74H0Z" fill="url(#platform)"/>
  <path d="M0 330 470 316l90 10-6 12-84-9L0 348Z" fill="#c2bcaa"/>
  <path d="M0 352 464 329l84 10-5 13-79-9L0 366Z" fill="#8d887c"/>
  <path d="M0 374 460 342l80 11-6 13-74-9L0 390Z" fill="#7c786d"/>
  <path d="M0 330 470 316l90 10" fill="none" stroke="#5d594f" stroke-opacity=".5" stroke-width="1.6"/>
  <path d="M0 352 464 329l84 10M0 374 460 342l80 11" fill="none" stroke="#5b574e" stroke-opacity=".45" stroke-width="1.4"/>
  <path d="M0 331 470 317l90 10M0 353 464 330l84 10" fill="none" stroke="#ded7c4" stroke-opacity=".3" stroke-width="1"/>

  <!-- shadowed interior behind the columns -->
  <path d="M0 168 520 176l40 8v150H0Z" fill="url(#dark)"/>

  <!-- lattice doors between the columns -->
  <path d="M62 196 118 200v112L62 308Z" fill="url(#lattice)" opacity=".5"/>
  <path d="M150 204 194 207v98l-44 6Z" fill="url(#lattice)" opacity=".45"/>
  <path d="M222 210 256 212v88l-34 5Z" fill="url(#lattice)" opacity=".4"/>
  <path d="M284 214 310 216v80l-26 4Z" fill="url(#lattice)" opacity=".34"/>
  <path d="M336 218 356 219v72l-20 3Z" fill="url(#lattice)" opacity=".3"/>
  <path d="M0 196 62 196v112L0 304Z" fill="url(#lattice)" opacity=".45"/>

  <!-- red columns, receding to the right -->
  <g>
    <path d="M34 172h34l-3 152-31 3Z" fill="url(#column)"/>
    <path d="M116 178h26l-2 143-25 3Z" fill="url(#column)"/>
    <path d="M186 184h22l-2 134-21 2Z" fill="url(#column)"/>
    <path d="M246 189h18l-1 126-18 2Z" fill="url(#column)"/>
    <path d="M294 193h14l-1 119-14 2Z" fill="url(#column)"/>
    <path d="M332 197h11l-1 112-11 1Z" fill="url(#column)"/>
    <path d="M366 200h9l-1 107-9 1Z" fill="url(#column)"/>
    <path d="M394 203h8l-1 102-8 1Z" fill="url(#column)"/>
  </g>
  <g fill="#4d4a43">
    <path d="M32 324h38l2 10-42 3Z"/><path d="M114 321h30l1 9-33 3Z"/>
    <path d="M184 318h26l1 8-28 2Z"/><path d="M244 315h22v8h-23Z"/>
    <path d="M292 312h18v8h-19Z"/><path d="M330 309h15v7h-16Z"/>
    <path d="M364 307h13v7h-14Z"/><path d="M392 305h12v6h-13Z"/>
  </g>

  <!-- bracket set under the eave -->
  <g fill="#6d2b25">
    <path d="M20 150h56v22H20Z"/><path d="M104 154h44v20h-44Z"/>
    <path d="M176 158h38v18h-38Z"/><path d="M238 161h30v17h-30Z"/>
    <path d="M288 164h24v15h-24Z"/><path d="M328 166h20v14h-20Z"/>
    <path d="M362 168h17v13h-17Z"/><path d="M392 170h14v12h-14Z"/>
  </g>
  <g fill="#a4443a" opacity=".7">
    <path d="M26 154h44v7H26Z"/><path d="M110 158h32v6h-32Z"/><path d="M180 162h28v5h-28Z"/>
    <path d="M242 164h22v5h-22Z"/><path d="M292 167h16v4h-16Z"/>
  </g>

  <!-- main beam -->
  <path d="M0 140 520 164l40 6v16L0 162Z" fill="url(#beam)"/>
  <path d="M0 152 520 174l40 5" fill="none" stroke="#d09a72" stroke-opacity=".55" stroke-width="2"/>
  <path d="M0 140 520 164l40 6" fill="none" stroke="#4a1c19" stroke-opacity=".6" stroke-width="1.6"/>

  <!-- roof underside with rafters -->
  <path d="M-20 106 470 138q26 2 40 12l-10 16q-16-10-38-13L-20 122Z" fill="url(#eave)"/>
  <g fill="none" stroke="#1a201d" stroke-opacity=".8" stroke-width="2">
    <path d="M12 110v14M56 112v13M100 114v12M144 116v11M188 118v10M232 120v9M276 122v8M320 124v8M364 126v7M408 128v6M452 130v6M494 134v6"/>
  </g>
  <g fill="none" stroke="#6d7a6a" stroke-opacity=".35" stroke-width="1.2">
    <path d="M20 109v14M64 111v13M108 113v12M152 115v11M196 117v10M240 119v9M284 121v8M328 123v8M372 125v7M416 127v6M460 129v6"/>
  </g>

  <!-- tiled roof surface, clipped so the tiles stay on the roof -->
  <use href="#roofPlane" fill="url(#roof)"/>
  <g clip-path="url(#roofClip)">
    <g fill="none" stroke="#b3c1a5" stroke-opacity=".34" stroke-width="2.2">
      <path d="M-10 48 6 114M40 52l14 62M92 56l12 60M144 60l10 58M196 64l8 56M248 67l6 54M300 70l4 52M352 73l2 50M404 76v48M456 79l-2 48"/>
    </g>
    <g fill="none" stroke="#202a25" stroke-opacity=".34" stroke-width="1.3">
      <path d="M18 50l14 63M70 54l12 61M122 58l10 59M174 62l8 57M226 66l6 55M278 69l4 53M330 72l2 51M382 75v49M434 78l-2 48"/>
    </g>
    <g fill="none" stroke="#c6d1b6" stroke-opacity=".16" stroke-width="1.6">
      <path d="M-20 74 470 104M-20 92 470 118"/>
    </g>
  </g>
  <!-- eave lip: row of tile ends -->
  <path d="M-20 102 470 134q26 2 40 12l-10 10q-14-9-36-11L-20 114Z" fill="#3d4a41"/>
  <path d="M-20 102 470 134q26 2 40 12l-10 10q-14-9-36-11L-20 114Z" fill="url(#tileEnds)" opacity=".5"/>
  <path d="M-20 102 470 134q26 2 40 12" fill="none" stroke="#a9b79c" stroke-opacity=".6" stroke-width="2.4"/>
  <path d="M-20 114 470 145q14 1 24 6" fill="none" stroke="#1e2622" stroke-opacity=".7" stroke-width="2"/>

  <rect width="560" height="400" filter="url(#grain)" opacity=".13"/>
  </g>
</svg>
