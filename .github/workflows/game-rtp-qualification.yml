name: Recompute game RTP
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/shared/**'
      - 'server/games/**'
      - 'server/demoExpansion.ts'
      - 'server/demoWalletRoutes.ts'
      - 'server/gameWalletRoutes.ts'
      - 'server/finance/nile-game-runtime.ts'
      - 'server/combat*.ts'
      - 'server/finance/pvp-money.ts'
      - 'server/finance/combat-escrow.ts'
      - 'scripts/game-math/rtp-*'
      - 'scripts/game-math/forest-heart-*'
      - 'scripts/game-math/wild-nudge-*'
      - 'server/demoExpansion.ts'
      - 'server/demoWallet*.ts'
      - 'server/gameWalletRoutes.ts'
      - 'server/finance/nile-game-runtime.ts'
      - 'server/pvp/virtual-wallet.ts'
      - 'server/database.ts'
      - 'src/wallet/ExpansionClient.ts'
      - 'games/forest-heart/presentation.ts'
      - 'scripts/database-test.ts'
      - 'scripts/qualify-game-rtp.mjs'
      - 'src/modules/GameModuleCatalog.ts'
      - 'games/*/package.json'
      - 'docs/game-math/qualifications/**'
      - '.github/workflows/game-rtp-qualification.yml'
  push:
    branches: [main]
    paths:
      - 'src/shared/**'
      - 'server/games/**'
      - 'server/demoExpansion.ts'
      - 'server/demoWalletRoutes.ts'
      - 'server/gameWalletRoutes.ts'
      - 'server/finance/nile-game-runtime.ts'
      - 'server/combat*.ts'
      - 'server/finance/pvp-money.ts'
      - 'server/finance/combat-escrow.ts'
      - 'scripts/game-math/rtp-*'
      - 'scripts/game-math/forest-heart-*'
      - 'scripts/game-math/wild-nudge-*'
      - 'server/demoExpansion.ts'
      - 'server/demoWallet*.ts'
      - 'server/gameWalletRoutes.ts'
      - 'server/finance/nile-game-runtime.ts'
      - 'server/pvp/virtual-wallet.ts'
      - 'server/database.ts'
      - 'src/wallet/ExpansionClient.ts'
      - 'games/forest-heart/presentation.ts'
      - 'scripts/database-test.ts'
      - 'scripts/qualify-game-rtp.mjs'
      - 'src/modules/GameModuleCatalog.ts'
      - 'games/*/package.json'
      - 'docs/game-math/qualifications/**'
      - '.github/workflows/game-rtp-qualification.yml'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        game: [studio-wild-nudge, studio-forest-heart, studio-flooded-temple, studio-neopolis, studio-dracona, mortal-kombat, studio-cosmic-escape, studio-caribbean-treasures, studio-afterglow]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:rtp
      - run: npm run qualify:rtp -- --game ${{ matrix.game }}
