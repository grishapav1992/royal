name: Recompute game RTP
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/shared/**'
      - 'server/games/**'
      - 'server/combat*.ts'
      - 'server/finance/pvp-money.ts'
      - 'server/finance/combat-escrow.ts'
      - 'scripts/game-math/rtp-*'
      - 'scripts/qualify-game-rtp.mjs'
      - 'src/modules/GameModuleCatalog.ts'
      - 'games/*/package.json'
      - 'docs/game-math/qualifications/**'
      - '.github/workflows/game-rtp-qualification.yml'
  push:
    branches: [main]
    paths:
      - 'src/shared/**'
      - 'server/games/**'
      - 'server/combat*.ts'
      - 'server/finance/pvp-money.ts'
      - 'server/finance/combat-escrow.ts'
      - 'scripts/game-math/rtp-*'
      - 'scripts/qualify-game-rtp.mjs'
      - 'src/modules/GameModuleCatalog.ts'
      - 'games/*/package.json'
      - 'docs/game-math/qualifications/**'
      - '.github/workflows/game-rtp-qualification.yml'
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        game: [studio-neopolis, studio-dracona, mortal-kombat]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:rtp
      - run: npm run qualify:rtp -- --game ${{ matrix.game }}
