name: Release build and game RTP gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: release-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  rtp-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v6
        with:
          path: |
            module-build/*-proof.json
            module-dist
          key: ${{ runner.os }}-modules-${{ hashFiles('package-lock.json', 'scripts/build-game-module.mjs', 'scripts/module-build-cache.mjs') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-modules-
      - run: npm run test:rtp-gate
      - run: npm run test:forest-heart-math
      - run: npm run test:forest-heart-server
      - run: npm run test:caribbean
      - run: npm run test:release
      - run: npm run test:work-sync
      - run: npm run release:prepare -- --local --base HEAD^
      - run: node --import tsx --test server-tests/independent-modules.test.ts server-tests/game-module-assets.test.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:forest-heart-ui
      - run: npm run test:slot-balance
      - run: npm run test:temple
      - run: node --import tsx scripts/database-test.ts --import tsx --test server-tests/cosmic-engine-audit.test.ts server-tests/cosmic-wallet-audit.test.ts server-tests/cosmic-origin-validation.test.ts server-tests/cosmic-origin-wallet.test.ts
      - run: node scripts/ci-release-cache.mjs
      - run: npm run release:verify
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.sha }}
          retention-days: 3
          if-no-files-found: error
          path: |
            dist
            dist-server/index.js
            dist-server/crypto-reconcile.js
            dist-server/payments.js
            dist-server/payments-meta.json
            module-dist
            module-build/release-manifest.json
            module-build/release-timings.json
            module-build/application-report.json
            module-build/build-report.json
