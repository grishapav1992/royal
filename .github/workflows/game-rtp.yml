name: Game RTP gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  rtp-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:rtp
      - run: npm run test:rtp-gate
      - run: npx tsc --noEmit
      - run: npm run test:slot-balance
