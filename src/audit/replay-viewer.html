<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-SCRIPT_HASH'; style-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Рояль · Просмотр аудита</title>
<style>
:root{color-scheme:dark;--bg:#10141a;--panel:#191f28;--edge:#394455;--text:#eef2f7;--muted:#aebacb;--accent:#efd08a;--alert:#ffb19e;font:16px/1.5 system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}main{max-width:1200px;margin:auto;padding:clamp(16px,4vw,48px)}
header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:baseline;margin-bottom:16px}h1,h2,h3,p{margin:0}h1{font-size:clamp(24px,4vw,38px)}h2{font-size:20px}h3{font-size:16px}
.tag,.muted{color:var(--muted)}.panel{padding:16px;background:var(--panel);border:1px solid var(--edge);border-radius:10px;min-width:0}
#status{margin-top:10px;min-height:24px}#status[data-error=true]{color:var(--alert)}input,button{font:inherit}input[type=file]{max-width:100%;margin:8px 0;color:var(--text)}
button,input[type=number]{color:var(--text);background:#252d39;border:1px solid var(--edge);padding:6px 12px;border-radius:6px;min-height:38px}
button:disabled{opacity:.45}button:not(:disabled){cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label{font-weight:600}#metadata{margin-top:14px;overflow-wrap:anywhere}
#playback{margin-top:16px}.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}.controls input[type=number]{width:112px}
#timeline{width:100%;accent-color:var(--accent)}#position,#seek-note{min-height:24px}#seek-note{color:var(--alert)}
.layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:14px;margin-top:14px}
.chess{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));width:min(100%,448px);margin:12px auto;aspect-ratio:1;border:1px solid var(--edge)}
.square{display:grid;place-items:center;color:#14191f;background:#d2bea1;font-size:clamp(16px,5vw,40px);line-height:1;aspect-ratio:1}.square.dark{background:#896f57;color:#fff5db}
.ring{height:175px;position:relative;margin:12px 0;border:1px solid var(--edge);border-bottom:4px solid #8a7854;border-radius:6px;overflow:hidden;background:#202938}
.fighter{position:absolute;transform:translateX(-50%);padding:4px;border-radius:5px;background:#305f83;color:#fff;white-space:nowrap}.fighter:nth-child(2){background:#944943}
.tokens{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.tokens span{border:1px solid var(--edge);background:#263142;padding:3px 7px;border-radius:4px}
#event p,#state p{margin:7px 0}#links{margin-top:12px}ul{padding-left:22px;overflow-wrap:anywhere}li{margin:5px 0}code{font-size:.9em;color:var(--accent)}
@media(max-width:740px){.layout{grid-template-columns:minmax(0,1fr)}main{padding:14px}}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<header><h1>Просмотр записи аудита</h1><span class="tag">Локальный режим</span></header>
<section class="panel" aria-label="Загрузка">
  <label for="package-file">Пакет воспроизведения JSON</label><br>
  <input id="package-file" type="file" accept="application/json,.json">
  <p id="status" role="status" aria-live="polite">Выберите файл пакета.</p>
  <p id="metadata" class="muted" hidden></p>
</section>
<section id="playback" hidden aria-label="Воспроизведение">
  <div class="panel">
    <div class="controls">
      <button id="previous" type="button">Назад</button>
      <button id="play" type="button">Воспроизвести</button>
      <button id="pause" type="button">Пауза</button>
      <button id="next" type="button">Шаг вперёд</button>
      <label for="jump-sequence">Номер события из сигнала</label>
      <input id="jump-sequence" type="number" min="0" step="1" inputmode="numeric">
      <button id="jump" type="button">Перейти</button>
    </div>
    <label for="timeline">Шкала событий</label>
    <input id="timeline" type="range" min="0" step="1" value="0">
    <p id="position" class="muted"></p>
    <p id="seek-note" role="status" aria-live="polite"></p>
  </div>
  <div class="layout">
    <section class="panel"><h2>Состояние</h2><div id="state"></div></section>
    <section class="panel"><h2>Событие</h2><div id="event"></div><div id="links"></div></section>
  </div>
</section>
</main>
<!-- REPLAY_SCRIPT -->
</body>
</html>
