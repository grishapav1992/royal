<title>Сердце леса: Живое дерево</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Макет: панель сценариев сверху, под ней игровая область в размере окна хоста. Один тёмный мир: ночной лес. */
:root{color-scheme:dark;
 --night:#060d1c;--bark:#0c1f19;--leaf:#123a2c;--gold:#d9b56a;--cream:#f6eac9;--mint:#63f5d0;--violet:#a77bff;--ember:#ffd875;
 --display:Georgia,'Times New Roman',serif;--text:Arial,Helvetica,sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--cream);font-family:var(--text);font-size:14px;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}button:disabled{cursor:default}
:focus-visible{outline:2px solid #b5ffe1;outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:#0a1526;border-bottom:1px solid #d9b56a33}
.bar h2{font:17px var(--display);margin:0;color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.chips>span{font-size:12px;color:#a9b4c6;margin-right:2px}
.chips button{border:1px solid #39506b;background:#122338;border-radius:6px;min-height:32px;padding:4px 10px;font-size:13px}
.chips button[aria-pressed=true]{background:#1d5a45;border-color:#7fe0b8}
.chips button:hover:not(:disabled){border-color:#9fc9e8}
.chips button:disabled{opacity:.45}
.stage{display:flex;justify-content:center;align-items:flex-start;overflow:hidden;padding:14px 0 24px}
.stage>div{position:relative;flex:none}
.fit{transform-origin:0 0;position:absolute;left:0;top:0;border-radius:6px;overflow:hidden;box-shadow:0 12px 40px #000a}

/* ИГРА */
.fh{position:relative;width:100%;height:100%;overflow:hidden;background:#071511;isolation:isolate;user-select:none;-webkit-user-select:none}
.fh *{-webkit-tap-highlight-color:transparent}
.fh-bg{position:absolute;inset:-14px;background:url(assets/background.webp) center/cover;animation:fh-drift 26s ease-in-out infinite alternate;z-index:0}
.fh-shade{position:absolute;inset:0;background:linear-gradient(0deg,#03100df2,#04100d55 26%,transparent 55%,#08142355);z-index:1}
.fh-dawn{position:absolute;inset:0;z-index:1;opacity:0;transition:opacity 1.6s;background:radial-gradient(ellipse at 45% 10%,#ffca6a66,transparent 62%),linear-gradient(0deg,#1d6a4b55,#8a4fb044 60%,#ffb25a33);mix-blend-mode:screen}
.fh[data-mode=bonus] .fh-dawn{opacity:1}
.fh-mist{position:absolute;left:-30%;width:160%;height:46%;bottom:2%;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 22% 62%,#7fa5ff2e,transparent 42%),radial-gradient(ellipse at 62% 74%,#86e8ff24,transparent 40%),radial-gradient(ellipse at 84% 52%,#b48cff26,transparent 38%);animation:fh-mist 34s ease-in-out infinite alternate}
.fh canvas{position:absolute;pointer-events:none;display:block}
.fh-back{inset:0;z-index:2}.fh-frame{z-index:5}.fh-board{z-index:6}.fh-fx{inset:0;z-index:30}.fh-bloom{inset:0;z-index:7}
.fh-elf{position:absolute;z-index:3;pointer-events:none;-webkit-mask-image:linear-gradient(#000 76%,transparent 99%);mask-image:linear-gradient(#000 76%,transparent 99%);transform-origin:50% 100%;animation:fh-breath 5.2s ease-in-out infinite;filter:drop-shadow(0 0 22px #9fb8ff2e)}
.fh-elf img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center bottom;opacity:0;transition:opacity .34s ease .24s;max-width:none}
.fh-elf img.on{opacity:1;z-index:1;transition:opacity .34s ease}
.fh-aura{position:absolute;z-index:2;border-radius:50%;opacity:0;transition:opacity .6s;pointer-events:none;background:radial-gradient(closest-side,var(--aura,#63f5d0),transparent);mix-blend-mode:screen}
.fh-title{position:absolute;z-index:9;pointer-events:none;max-width:none;filter:drop-shadow(0 6px 10px #000b)}
.fh-cells{position:absolute;z-index:7;display:grid;grid-template:repeat(5,1fr)/repeat(5,1fr)}
.fh-cells button{border:0;background:none;padding:0;border-radius:7%;min-width:0}
.fh-cells button:disabled{pointer-events:none}
.fh-crystal{position:absolute;z-index:8;pointer-events:none}
.fh-crystal img{position:absolute;inset:0;width:100%;height:100%;max-width:none;filter:drop-shadow(0 6px 10px #000a)}
.fh-crystal .gem{clip-path:polygon(51% 14%,69% 27%,83% 42%,71% 59%,51% 73%,33% 59%,19% 42%,34% 27%);filter:var(--gem,none);transition:filter .4s;animation:fh-gem 3.4s ease-in-out infinite}
.fh-crystal .halo{position:absolute;left:50%;top:42%;width:190%;aspect-ratio:1;transform:translate(-50%,-50%) scale(var(--halo,.8));opacity:var(--halo-o,.45);background:radial-gradient(closest-side,var(--e),transparent 70%);mix-blend-mode:screen;transition:transform .5s,opacity .5s}
.fh-energy{position:absolute;z-index:10;border:1px solid color-mix(in srgb,var(--e) 70%,#fff0);background:#081c17ee;color:var(--e);border-radius:99px;font:700 20px/1 var(--text);min-height:34px;min-width:58px;padding:0 10px;transform:translate(-50%,0);box-shadow:0 0 14px color-mix(in srgb,var(--e) 35%,transparent);white-space:nowrap}
.fh-energy small{display:block;font:11px/1.1 var(--text);color:#d8dccb;letter-spacing:.02em}
.fh-energy.pop{animation:fh-pop .7s ease-out}
.fh-flower{position:absolute;z-index:8;pointer-events:none}
.fh-flower img{position:absolute;max-width:none;transform-origin:50% 88%}
.fh-flower .bud{filter:drop-shadow(0 5px 7px #000a)}
.fh-flower .open{opacity:0;transform:scale(.35);filter:drop-shadow(0 0 16px #ffcf6a99)}
.fh-flower .petals{position:absolute;left:50%;top:70%;width:0;height:0}
.fh-flower .petals i{position:absolute;left:0;top:0;width:calc(var(--s)*.3);height:calc(var(--s)*.58);margin-left:calc(var(--s)*-.15);margin-top:calc(var(--s)*-.58);border-radius:60% 60% 46% 46%/78% 78% 26% 26%;background:linear-gradient(0deg,#ffe39a,#f3b4d4 45%,#c9a2ea);box-shadow:inset 0 0 8px #fff8;opacity:0;transform-origin:50% 100%}
.fh-flower .v{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;font:700 15px/1 var(--text);color:#cbd6cc;background:#07191add;border:1px solid #7b8f7a55;border-radius:99px;padding:5px 10px;font-variant-numeric:tabular-nums;transition:color .3s,background .3s,border-color .3s}
.fh-flower[data-paid=true] .v{color:#fff1c2;background:#4a3a12ee;border-color:#f2cf78}
.fh-seeds{position:absolute;z-index:9;pointer-events:none}
.fh-seed{position:absolute;transform:translate(-50%,-50%) rotate(45deg);border-radius:6% 62% 62% 62%;background:radial-gradient(circle at 40% 32%,#6d5a3c,#33271a 70%);border:1px solid #8d7445;box-shadow:0 2px 5px #000b;transition:background .5s,box-shadow .5s,border-color .5s}
.fh[data-mode=bonus] .fh-seed{background:radial-gradient(circle at 40% 32%,#fff4c9,#eab545 55%,#8a5a15);border-color:#ffe9ad;box-shadow:0 0 16px #ffd26caa}
.fh[data-mode=bonus] .fh-seed.used{background:radial-gradient(circle at 40% 32%,#7a6a50,#3a2d1f 70%);border-color:#8d7445;box-shadow:none;opacity:.75}
.fh-seed.pop{animation:fh-seed .6s ease-out}

.fh-plate{position:absolute;z-index:12;display:grid;grid-template-columns:minmax(0,1.35fr) auto minmax(0,1fr);align-items:center;gap:10px;padding:6px 18px;border-radius:14px;border:1px solid #c9a35a;background:linear-gradient(#1b3b2cf7,#0c2019f7);box-shadow:inset 0 0 0 3px #0a1812,inset 0 0 0 4px #7b643388,0 8px 18px #000a}
.fh-plate .say{min-width:0}
.fh-plate .say b{display:block;font:16px/1.2 var(--display);color:#fbefcb}
.fh-plate .say span{display:block;font-size:12px;line-height:1.3;color:#c6d3bf}
.fh-plate .sum{text-align:center;min-width:130px}
.fh-plate .sum small,.fh-plate .net small{display:block;font-size:12px;color:#c6d3bf}
.fh-plate .sum b{display:block;font:700 28px/1.1 var(--text);font-variant-numeric:tabular-nums;color:#fff3cd;transform-origin:50% 60%}
.fh-plate .sum b.bump{animation:fh-bump .35s ease-out}
.fh-plate .net{text-align:right}
.fh-plate .net b{font:700 18px/1.2 var(--text);font-variant-numeric:tabular-nums;color:#cfd8cf}
.fh-plate[data-tier=win],.fh-plate[data-tier=big]{border-color:#ffe09a;box-shadow:inset 0 0 0 3px #0a1812,inset 0 0 0 4px #d9b56a,0 0 26px #ffd26c66}
.fh-plate[data-tier=win] .net b,.fh-plate[data-tier=big] .net b{color:#b9f5c9}
.fh-plate[data-tier=big] .sum b{background:linear-gradient(#fffbe6,#ffd875 60%,#e29a2c);-webkit-background-clip:text;background-clip:text;color:transparent;animation:fh-glory 1.3s ease-in-out infinite alternate}

.fh-ctl{position:absolute;z-index:12;display:grid;align-items:center;gap:10px;grid-template-columns:minmax(0,1fr) 60px minmax(210px,1.3fr) 60px minmax(0,1fr)}
.fh-ctl label,.fh-ctl .lb{font-size:12px;color:#c6d3bf;display:block}
.fh-money b{font:700 19px/1.25 var(--text);font-variant-numeric:tabular-nums}
.fh-money small{font-size:12px;color:#9fb0a2}
.fh-stake .row{display:flex;gap:4px;align-items:stretch}
.fh-stake button{width:40px;min-height:44px;border:1px solid #9c8a52;background:#153a2b;border-radius:9px;font-size:20px}
.fh-stake select{flex:1;min-width:0;width:100%;min-height:44px;border:1px solid #9c8a52;background:#0c261c;border-radius:9px;padding:0 6px;font-weight:700;font-size:16px;text-align:center}
.fh-stake :disabled{opacity:.45}
.fh-round{width:58px;height:58px;border-radius:50%;border:2px solid #b8924c;background:radial-gradient(circle at 40% 30%,#2a5743,#0b1f18 75%);box-shadow:inset 0 0 0 3px #0a1812,0 4px 10px #000a;font-size:12px;font-weight:700;line-height:1.05;padding:0;color:#f3e3b7}
.fh-round svg{display:block;margin:0 auto 1px;width:21px;height:21px}
.fh-round[aria-pressed=true]{background:radial-gradient(circle at 40% 30%,#ffe6a6,#c79339 82%);color:#241703;border-color:#ffe9b0}
.fh-round:disabled{opacity:.45}
.fh-go{position:relative;height:66px}
.fh-go>button{position:absolute;inset:0;width:100%;border:0;padding:0 12px;background:linear-gradient(#e8c983,#8f6a2c 45%,#d8b269);clip-path:polygon(0 50%,17px 8%,34px 0,calc(100% - 34px) 0,calc(100% - 17px) 8%,100% 50%,calc(100% - 17px) 92%,calc(100% - 34px) 100%,34px 100%,17px 92%)}
.fh-go>button:before{content:'';position:absolute;inset:3px;clip-path:inherit;background:radial-gradient(ellipse at 50% 118%,#62ffd0,#159a70 38%,transparent 72%),linear-gradient(#0d4434,#0a3327);transition:filter .25s}
.fh-go>button:after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 40%,#fff6 50%,transparent 60%) no-repeat -160% 0/60% 100%;animation:fh-sheen 5.5s ease-in-out infinite}
.fh-go>button:hover:not(:disabled):before{filter:brightness(1.22)}
.fh-go>button:active:not(:disabled):before{filter:brightness(.85)}
.fh-go>button:disabled{filter:saturate(.4) brightness(.68)}
.fh-go span{position:relative;display:block;font:700 21px/1.1 var(--display);letter-spacing:.05em;color:#fff1c9;text-shadow:0 2px 4px #000a}
.fh-go small{position:relative;display:block;font-size:12px;color:#e2f5e6;margin-top:2px}
.fh-go img{position:absolute;left:50%;pointer-events:none;z-index:2;max-width:none;filter:drop-shadow(0 2px 3px #000a)}
.fh-go .gt{width:78px;bottom:calc(100% - 9px);margin-left:-39px}.fh-go .gb{width:46px;top:calc(100% - 9px);margin-left:-23px}
.fh[data-mode=bonus] .fh-go>button:before{background:radial-gradient(ellipse at 50% 118%,#ffe39a,#b97a1c 40%,transparent 74%),linear-gradient(#573a10,#3a260a)}
.fh-go.wait>button:before{animation:fh-charge .7s ease-in-out infinite alternate}
.fh-tools{position:absolute;z-index:13;display:flex;gap:8px}
.fh-tools button{width:44px;height:44px;border-radius:50%;border:1px solid #b8924c;background:#0a211ad9;padding:0;display:grid;place-items:center}
.fh-tools svg{width:20px;height:20px}
.fh svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fh-fly{position:absolute;z-index:31;pointer-events:none;font:700 22px/1 var(--text);color:#fff2b8;text-shadow:0 0 12px #ffc74a,0 2px 3px #000}
.fh-banner{position:absolute;z-index:32;pointer-events:none;text-align:center;font:26px/1.15 var(--display);color:#fff4cf;text-shadow:0 0 18px #ffb938,0 3px 6px #000;opacity:0;transform:translate(-50%,-50%);white-space:nowrap;padding:26px 70px;background:radial-gradient(closest-side,#05120ff2 35%,#05120fb8 62%,transparent)}
.fh-banner small{display:block;font:15px var(--text);color:#fff0c4;margin-top:3px}

.fh-veil{position:absolute;inset:0;z-index:40;display:grid;place-items:center;background:#030b0dcc;padding:12px}
.fh-win{width:min(440px,100%);max-height:100%;overflow:auto;border-radius:16px;border:1px solid #c9a35a;background:linear-gradient(#17372af7,#0a1c15f7);box-shadow:inset 0 0 0 4px #0a1812,inset 0 0 0 5px #7b643388,0 20px 50px #000;padding:20px}
.fh-win header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.fh-win h3{font:23px/1.15 var(--display);margin:0;color:#fbe9b8}
.fh-win p{margin:0 0 12px;line-height:1.45;color:#dbe3d2}
.fh-win .x{width:44px;height:44px;border-radius:50%;border:1px solid #b8924c;background:#0a211a;font-size:20px}
.fh-win .opts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.fh-win .opts button{min-height:52px;border-radius:12px;border:1px solid #9c8a52;background:#0c261c;font:700 19px var(--text)}
.fh-win .opts button[aria-checked=true]{background:linear-gradient(#f0cf83,#b98732);color:#241703;border-color:#ffe9b0}
.fh-win .ok{width:100%;min-height:52px;border-radius:12px;border:1px solid #f0cf83;background:linear-gradient(#1f8a66,#0d4a37);font:700 17px var(--display);letter-spacing:.03em;color:#fff1c9}
.fh-win .big{font:700 40px/1.1 var(--text);text-align:center;background:linear-gradient(#fffbe6,#ffd875 60%,#e29a2c);-webkit-background-clip:text;background-clip:text;color:transparent;margin:4px 0}
.fh-win .ctr{text-align:center}
.fh-win ul{padding:0;margin:0 0 12px;list-style:none;display:grid;gap:8px}
.fh-win li{display:flex;gap:10px;align-items:flex-start;line-height:1.4}
.fh-win li b{flex:none;width:58px;color:var(--ember)}
.fh-win .sw{display:flex;justify-content:space-between;align-items:center;min-height:44px;font-size:15px}
.fh-win .sw input{width:22px;height:22px;accent-color:#2fae82}

.fh[data-layout=full] .fh-money{order:5;text-align:right}.fh[data-layout=full] .fh-spacer{display:none}
.fh[data-narrow=true][data-layout] .fh-go span{font-size:15px;letter-spacing:.02em}
/* портрет */
.fh[data-layout=portrait] .fh-ctl{grid-template-columns:62px minmax(0,1fr) 62px;grid-template-areas:"money money stake" "auto go fast";gap:12px 10px}
.fh[data-layout=portrait] .fh-ctl{grid-template-areas:none;grid-template-columns:62px minmax(0,1fr) 62px;gap:26px 10px}
.fh[data-layout=portrait] .fh-top2{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:10px;align-items:end}
.fh-top2{display:contents}
.fh[data-layout=portrait] .fh-plate{grid-template-columns:minmax(0,1fr) auto;padding:7px 14px;gap:2px 10px}
.fh[data-layout=portrait] .fh-plate .say{grid-column:1;grid-row:1/3}
.fh[data-layout=portrait] .fh-plate .sum{min-width:104px;text-align:right}
.fh[data-layout=portrait] .fh-plate .sum b{font-size:24px}
.fh[data-layout=portrait] .fh-plate .net{display:flex;gap:6px;justify-content:flex-end;align-items:baseline}
.fh[data-layout=portrait] .fh-plate .net b{font-size:14px}
.fh[data-layout=portrait] .fh-plate .say b{font-size:15px}
.fh[data-layout=portrait] .fh-go span,.fh[data-layout=landscape] .fh-go span{font-size:18px}
.fh[data-layout=portrait] .fh-spacer,.fh[data-layout=landscape] .fh-spacer{display:none}
.fh[data-layout=portrait] .fh-flower .v,.fh[data-layout=landscape] .fh-flower .v{font-size:12px;padding:3px 6px}
.fh[data-layout=portrait] .fh-energy,.fh[data-layout=landscape] .fh-energy{font-size:15px;min-width:42px;min-height:24px;padding:0 6px}
.fh[data-layout=portrait] .fh-energy small,.fh[data-layout=landscape] .fh-energy small{display:none}
/* горизонталь */
.fh[data-layout=landscape] .fh-ctl{grid-template-columns:minmax(0,1fr) 46px 46px;gap:5px 6px}
.fh[data-layout=landscape] .fh-stake{grid-area:2/1/3/-1}.fh[data-layout=landscape] .fh-go{grid-area:3/1/4/-1;margin-top:9px}
.fh[data-layout=landscape] .fh-money b{font-size:17px}
.fh[data-layout=landscape] .fh-money small{display:none}
.fh[data-layout=landscape] .fh-stake .lb{display:none}
.fh[data-layout=landscape] .fh-round{width:46px;height:46px;font-size:11px;font-weight:600;letter-spacing:-.03em}
.fh[data-layout=landscape] .fh-ctl:before{content:'';position:absolute;inset:-8px -6px -6px;border-radius:14px;background:#06140fd0;z-index:-1}
.fh[data-layout=landscape] .fh-round svg{width:17px;height:17px}
.fh[data-layout=landscape] .fh-go{height:52px}
.fh[data-layout=landscape] .fh-go span{font-size:17px}
.fh[data-layout=landscape] .fh-go small{font-size:11px}
.fh[data-layout=landscape] .fh-go .gt{width:52px;margin-left:-26px}.fh[data-layout=landscape] .fh-go .gb{display:none}
.fh[data-layout=landscape] .fh-plate{grid-template-columns:1fr auto;gap:0 8px;padding:5px 12px}
.fh[data-layout=landscape] .fh-plate .say{grid-column:1/-1}
.fh[data-layout=landscape] .fh-plate .sum{text-align:left;min-width:0}
.fh[data-layout=landscape] .fh-plate .sum b{font-size:22px}
.fh[data-layout=landscape] .fh-plate .say b{font-size:14px}

@keyframes fh-drift{from{transform:scale(1.015) translate(-5px,2px)}to{transform:scale(1.04) translate(6px,-4px)}}
@keyframes fh-mist{from{transform:translateX(-7%)}to{transform:translateX(9%)}}
@keyframes fh-breath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.004,1.009)}}
@keyframes fh-gem{0%,100%{opacity:.92}50%{opacity:1}}
@keyframes fh-pop{0%{transform:translate(-50%,0) scale(.6)}35%{transform:translate(-50%,0) scale(1.45)}100%{transform:translate(-50%,0) scale(1)}}
@keyframes fh-seed{0%{transform:translate(-50%,-50%) rotate(45deg) scale(1)}40%{transform:translate(-50%,-50%) rotate(45deg) scale(1.7);filter:brightness(1.8)}100%{transform:translate(-50%,-50%) rotate(45deg) scale(1)}}
@keyframes fh-bump{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes fh-glory{from{transform:scale(1.02)}to{transform:scale(1.13)}}
@keyframes fh-sheen{0%,62%{background-position:-160% 0}92%,100%{background-position:260% 0}}
@keyframes fh-charge{from{filter:brightness(.9)}to{filter:brightness(1.45)}}
.fh.calm *,.fh.calm *:before,.fh.calm *:after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){.fh *,.fh *:before,.fh *:after{animation:none!important;transition:none!important}}
</style>
<div class="bar">
 <h2>Сердце леса: «Живое дерево»</h2>
 <div class="chips" role="group" aria-label="Экран"><span>Экран</span><button id="d-desk" data-dev="desk">Компьютер с чатом</button><button id="d-phone" data-dev="phone">Телефон</button><button id="d-land" data-dev="land">Горизонтально</button></div>
 <div class="chips" role="group" aria-label="Следующее пробуждение"><span>Следующий исход</span>
  <button id="s-random" data-sc="random">Случайный</button><button id="s-loss" data-sc="loss">Пусто</button><button id="s-partial" data-sc="partial">1 цветок</button><button id="s-win" data-sc="win">3 цветка</button><button id="s-e5" data-sc="e5">Энергия ×5</button><button id="s-e20" data-sc="e20">×20</button><button id="s-choice" data-sc="choice">Руна</button><button id="s-bonus" data-sc="bonus">Бонус</button><button id="s-max" data-sc="max">Максимум</button></div>
</div>
<div class="stage"><div id="shell"><div class="fit" id="fit"><main class="fh" id="fh" data-mode="base" data-layout="full">
