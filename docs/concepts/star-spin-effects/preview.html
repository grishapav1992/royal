<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Star Spin | Сравнение эффектов</title><style>/*GAME_CSS*/</style><style>/*STUDIO_CSS*/</style></head>
<body class="studio">
<svg width="0" height="0" aria-hidden="true" style="position:absolute"><defs><filter id="vertical-blur"><feGaussianBlur stdDeviation="0 2.1"/></filter></defs></svg>
<div class="desk">
<header class="desk-heading"><div><h1>Star Spin</h1><p>Сравнение эффектов</p></div>
<nav id="views" aria-label="Режим просмотра"><button data-view="compare" aria-pressed="true">Рядом</button><button data-view="old">Текущий экран</button><button data-view="new">Новые эффекты</button></nav></header>
<main>
<div id="stages" class="stages" data-view="compare">
<article class="panel" data-panel="old"><header><h2>Текущий экран</h2><button class="expand" data-expand="old" aria-label="Развернуть текущий экран">Развернуть ↗</button></header><div class="viewport"><div class="mount"></div></div></article>
<article class="panel" data-panel="new"><header><h2>Новые эффекты</h2><button class="expand" data-expand="new" aria-label="Развернуть новые эффекты">Развернуть ↗</button></header><div class="viewport"><div class="mount"></div></div></article>
</div>
<section class="lab" aria-label="Сценарии сравнения"><div class="lab-top"><h2>Сценарии</h2><div id="actions"><button id="repeat">↻ Повторить</button><button id="finish" disabled>Показать итог</button></div></div>
<div class="scenarios" id="scenarios"></div>
<div class="prefs"><label>Героиня <select id="hero"></select></label><label><input type="checkbox" id="fast"> Быстрый режим</label><label><input type="checkbox" id="reduce"> Уменьшенное движение</label><label><input type="checkbox" id="sound"> Звук</label></div>
<div class="footnote"><span id="description" role="status"></span><span>Фиксированная ставка <b>0,10 USDT</b> · Демораунды</span></div>
</section>
</main></div>
<script type="application/json" id="media">/*MEDIA_DATA*/</script><script>/*APP_JS*/</script>
</body></html>
