services:
  game:
    environment:
      ROYAL_AUDIT_SCHEMA: ${ROYAL_AUDIT_SCHEMA:?Set the provisioned audit schema}
      ROYAL_AUDIT_TEST_DATASET_ID: ${ROYAL_AUDIT_TEST_DATASET_ID:-}
      ROYAL_AUDIT_LIVE_DATASET_ID: ${ROYAL_AUDIT_LIVE_DATASET_ID:-}
      ROYAL_AUDIT_RECORDER_DB_URL_FILE: /run/secrets/royal_audit_recorder_url
      ROYAL_AUDIT_PGSSLMODE: ${ROYAL_AUDIT_PGSSLMODE:-disable}
      ROYAL_AUDIT_PGSSLROOTCERT: ${ROYAL_AUDIT_PGSSLROOTCERT:-}
      ROYAL_AUDIT_CHESS_REPLAY: ${ROYAL_AUDIT_CHESS_REPLAY:-0}
      ROYAL_AUDIT_COMBAT_REPLAY: ${ROYAL_AUDIT_COMBAT_REPLAY:-0}
      ROYAL_AUDIT_CARD_REPLAY: ${ROYAL_AUDIT_CARD_REPLAY:-0}
      ROYAL_AUDIT_SPORT_REPLAY: ${ROYAL_AUDIT_SPORT_REPLAY:-0}
      ROYAL_AUDIT_TSU_REPLAY: ${ROYAL_AUDIT_TSU_REPLAY:-0}
      ROYAL_AUDIT_TOTE_ADMISSION: ${ROYAL_AUDIT_TOTE_ADMISSION:-0}
    secrets: [royal_audit_recorder_url]

secrets:
  royal_audit_recorder_url:
    file: ${ROYAL_AUDIT_RECORDER_SECRET_FILE:?Set the private recorder URL file path}
