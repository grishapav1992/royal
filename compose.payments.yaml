services:
  game:
    environment:
      PAYMENTS_SERVICE_URL: http://payments:2570
      PAYMENTS_REQUEST_SECRET_FILE: /run/secrets/payments_request_secret
      PAYMENTS_EVENT_SECRET_FILE: /run/secrets/payments_event_secret
    secrets: [payments_request_secret, payments_event_secret]
    networks: [payment_bridge]
  caddy:
    networks: [default, payment_bridge]
  payments:
    image: royal-payments:latest
    restart: unless-stopped
    init: true
    command: [node, dist-server/payments.js]
    env_file: ["/opt/royal-payment-secrets/provider.env"]
    environment:
      NODE_ENV: production
      PORT: 2570
      PGHOST: ${ROYAL_PGHOST:-finance-db}
      PGPORT: ${ROYAL_PGPORT:-5432}
      PGDATABASE: ${ROYAL_PGDATABASE:-royal_finance_sim}
      PGUSER: royal_payments_app
      PGPASSWORD_FILE: /run/secrets/payments_database_password
      PGSSLMODE: ${ROYAL_PGSSLMODE:-disable}
      PGPOOL_MAX: 4
      PGAPPNAME: royal-payments
      PAYMENTS_REQUEST_SECRET_FILE: /run/secrets/payments_request_secret
      PAYMENTS_EVENT_SECRET_FILE: /run/secrets/payments_event_secret
      PAYMENTS_GAME_EVENTS_URL: http://game:2567/internal/payments/events
    secrets: [payments_database_password, payments_request_secret, payments_event_secret]
    networks: [payment_bridge, royal_database, payments_egress]
    expose: ["2570"]
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpu_shares: 2048
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:2570/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
networks:
  payment_bridge:
    internal: true
  payments_egress: {}
secrets:
  payments_database_password:
    file: /opt/royal-payment-secrets/database-password
  payments_request_secret:
    file: /opt/royal-payment-secrets/request-secret
  payments_event_secret:
    file: /opt/royal-payment-secrets/event-secret
